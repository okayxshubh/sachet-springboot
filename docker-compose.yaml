version: "3.9"

services:
  db:
    image: postgres:17
    container_name: sachet_db
    environment:
      POSTGRES_DB: sachet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  springboot:
    build: ./springboot
    container_name: springboot
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  ollama: