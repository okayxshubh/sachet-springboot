spring.application.name=SachetSpringboot
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/sachet_db
spring.datasource.driver-class-name=org.postgresql.Driver
server.tomcat.use-apr=false

# ID AND PASS
spring.datasource.username=postgres
spring.datasource.password=postgres

# Data.sql initialisation
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

server.error.include-message=never
server.error.include-stacktrace=never

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO

# Fixing Timestamp Issue
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# Fix the issue
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.tomcat.relaxed-path-chars=/,%
server.tomcat.relaxed-query-chars=/,%

# Return GenericResponse for 404s
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Global API rate limiting
rate-limit.api.enabled=true
rate-limit.api.requests=120
rate-limit.api.window-seconds=60
